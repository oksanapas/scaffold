<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Scaffold - design competence-oriented learning experiences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: guided five-step planner — step rail on top, one step per screen, review sheet at the end */
:root {
  --bg: #eef3f6; --surface: #ffffff; --surface-2: #f6f9fb;
  --ink: #17242e; --ink-soft: #4f6170; --line: #cfdbe3;
  --accent: #0f6f8f; --accent-ink: #ffffff; --danger: #b4372f;
  --assess: #1a5fb4; --assess-fill: #e2ecfa; --assess-ink: #0d2f5c;
  --teach: #0f8fa6; --teach-fill: #d9f1f5; --teach-ink: #08404b;
  --dig-fill: #ffe3c4; --dig-edge: #e0811f; --dig-ink: #5a2d00;
  --grn-fill: #d6ecd0; --grn-edge: #3d7f2c; --grn-ink: #183d10;
  --ent-fill: #f3dcee; --ent-edge: #a3287f; --ent-ink: #4a0d39;
  --lif-fill: #e8f2c8; --lif-edge: #6c9a10; --lif-ink: #2c3f05;
  --trn-fill: #cdeceb; --trn-edge: #1c8584; --trn-ink: #0a3a3a;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --shadow: 0 1px 2px rgba(23,36,46,.08), 0 4px 14px rgba(23,36,46,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171d; --surface: #17222a; --surface-2: #1c2932; --ink: #e6eef3; --ink-soft: #9db0bd; --line: #2d3d48;
    --accent: #4fb6d6; --accent-ink: #06222c; --danger: #ef7b72;
    --assess: #6fa3ec; --assess-fill: #182c47; --assess-ink: #dbe8fb;
    --teach: #4cc3d8; --teach-fill: #123a42; --teach-ink: #d3f3f8;
    --dig-fill: #4a2c0e; --dig-edge: #f09a3e; --dig-ink: #ffe2c2;
    --grn-fill: #1f3a19; --grn-edge: #6fb85a; --grn-ink: #d9f2d0;
    --ent-fill: #42163a; --ent-edge: #e06ec0; --ent-ink: #fbe0f3;
    --lif-fill: #2e3a12; --lif-edge: #a9d34a; --lif-ink: #eef7d4;
    --trn-fill: #113a3a; --trn-edge: #43b9b7; --trn-ink: #d2f3f2;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171d; --surface: #17222a; --surface-2: #1c2932; --ink: #e6eef3; --ink-soft: #9db0bd; --line: #2d3d48;
  --accent: #4fb6d6; --accent-ink: #06222c; --danger: #ef7b72;
  --assess: #6fa3ec; --assess-fill: #182c47; --assess-ink: #dbe8fb;
  --teach: #4cc3d8; --teach-fill: #123a42; --teach-ink: #d3f3f8;
  --dig-fill: #4a2c0e; --dig-edge: #f09a3e; --dig-ink: #ffe2c2;
  --grn-fill: #1f3a19; --grn-edge: #6fb85a; --grn-ink: #d9f2d0;
  --ent-fill: #42163a; --ent-edge: #e06ec0; --ent-ink: #fbe0f3;
  --lif-fill: #2e3a12; --lif-edge: #a9d34a; --lif-ink: #eef7d4;
  --trn-fill: #113a3a; --trn-edge: #43b9b7; --trn-ink: #d2f3f2;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 800; }
h2 { font-size: clamp(1.3rem, 2.4vw, 1.7rem); font-weight: 800; }
h3 { font-size: 1.05rem; font-weight: 800; }
p { margin: 0; }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-soft); }
.hint { color: var(--ink-soft); font-size: .9rem; }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Stepper */
.steps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; list-style: none; margin: 0; padding: 0; }
.steps button {
  width: 100%; text-align: left; border: none; background: var(--surface); border-radius: 10px; padding: 9px 10px;
  display: flex; flex-direction: column; gap: 2px; border-bottom: 4px solid var(--line); min-width: 0;
}
.steps .n { font-family: var(--f-mono); font-size: .7rem; color: var(--ink-soft); }
.steps .t { font-weight: 700; font-size: .85rem; line-height: 1.2; overflow-wrap: anywhere; }
.steps button.done { border-bottom-color: var(--accent); }
.steps button.current { border-bottom-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.steps button.current .n { color: inherit; opacity: .85; }
@media (max-width: 700px) {
  .steps { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .steps .t { display: none; }
  .steps button { align-items: center; padding: 8px 4px; }
}

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: clamp(16px, 3vw, 28px); display: flex; flex-direction: column; gap: 20px; }
.panel-head { display: flex; flex-direction: column; gap: 6px; }
.panel-head .prompt { color: var(--ink-soft); max-width: 65ch; }
.block { display: flex; flex-direction: column; gap: 10px; }

/* Form fields */
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
@media (max-width: 700px) { .fields { grid-template-columns: minmax(0, 1fr); } }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-weight: 700; font-size: .92rem; }
.field .sub { font-size: .8rem; color: var(--ink-soft); }
textarea, input[type="text"] {
  width: 100%; font: inherit; font-size: .95rem; color: var(--ink); background: var(--surface-2);
  border: 1.5px solid var(--line); border-radius: 9px; padding: 8px 10px; resize: vertical;
}
textarea { min-height: 70px; }
textarea:focus, input[type="text"]:focus { border-color: var(--accent); outline: none; background: var(--surface); }

/* Topic choices */
.topics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 700px) { .topics { grid-template-columns: minmax(0, 1fr); } }
.topic {
  text-align: left; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 12px;
  display: flex; gap: 10px; align-items: flex-start; min-width: 0;
}
.topic .k { font-family: var(--f-mono); font-size: .72rem; color: var(--ink-soft); padding-top: 3px; flex: none; width: 1.6em; }
.topic:hover { border-color: var(--accent); }
.topic[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.topic[aria-pressed="true"] .k { color: inherit; }

/* Competence picker */
.fw { border: 1.5px solid var(--edge); border-radius: 12px; overflow: hidden; }
.fw > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; background: var(--fill); color: var(--cink); }
.fw > summary::-webkit-details-marker { display: none; }
.fw > summary .nm { font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; }
.fw > summary .ct { font-family: var(--f-mono); font-size: .72rem; }
.fw > summary .ct::after { content: " ▾"; }
.fw[open] > summary .ct::after { content: " ▴"; }
.fw-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
.fw-area { display: flex; flex-direction: column; gap: 6px; }
.fw-area .an { font-family: var(--f-mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1.5px solid var(--edge); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 11px; font-size: .86rem;
  display: inline-flex; gap: 6px; align-items: center; max-width: 100%; text-align: left;
}
.chip[aria-pressed="true"] { background: var(--fill); color: var(--cink); font-weight: 700; }
.chip[aria-pressed="true"]::before { content: "✓"; }
.fw-dig { --fill: var(--dig-fill); --edge: var(--dig-edge); --cink: var(--dig-ink); }
.fw-grn { --fill: var(--grn-fill); --edge: var(--grn-edge); --cink: var(--grn-ink); }
.fw-ent { --fill: var(--ent-fill); --edge: var(--ent-edge); --cink: var(--ent-ink); }
.fw-lif { --fill: var(--lif-fill); --edge: var(--lif-edge); --cink: var(--lif-ink); }
.fw-trn { --fill: var(--trn-fill); --edge: var(--trn-edge); --cink: var(--trn-ink); }
.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1; min-width: 0; }
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 15px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--ink-soft); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger-armed { border-color: var(--danger); color: var(--danger); }
.selected-box { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.selected-box .empty { color: var(--ink-soft); font-size: .9rem; }
.note-list { display: flex; flex-direction: column; gap: 10px; }
.note-row { display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.note-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.note-top .fw-tag { font-family: var(--f-mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
.note-top .x-chip { margin-left: auto; font-size: 1.2rem; padding: 2px 6px; }
.rlist { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; }
.x-chip { border: none; background: none; padding: 0 0 0 4px; font-size: 1rem; line-height: 1; opacity: .7; }
.x-chip:hover { opacity: 1; }

/* Method cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.mcard {
  text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; overflow: hidden;
  display: flex; flex-direction: column; min-width: 0; transition: border-color .15s, box-shadow .15s;
}
.mcard .top { padding: 12px 14px; background: var(--kfill); color: var(--kink); display: flex; flex-direction: column; gap: 2px; }
.mcard .kind { font-family: var(--f-mono); font-size: .64rem; text-transform: uppercase; letter-spacing: .1em; opacity: .8; }
.mcard .nm { font-family: var(--f-display); font-weight: 800; font-size: 1.02rem; line-height: 1.2; }
.mcard .ds { padding: 10px 14px 14px; font-size: .85rem; color: var(--ink-soft); }
.mcard:hover { border-color: var(--kedge); }
.mcard[aria-pressed="true"] { border-color: var(--kedge); box-shadow: var(--shadow); }
.mcard[aria-pressed="true"] .top { background: var(--kedge); color: var(--surface); }
.mcard[aria-pressed="true"] .nm::after { content: "  ✓"; }
.k-assess { --kfill: var(--assess-fill); --kedge: var(--assess); --kink: var(--assess-ink); }
.k-teach { --kfill: var(--teach-fill); --kedge: var(--teach); --kink: var(--teach-ink); }

/* Nav */
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.nav .right { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }

/* Review */
.sheet { display: flex; flex-direction: column; gap: 18px; }
.sheet section { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.sheet section:first-child { border-top: none; padding-top: 0; }
.kv { display: grid; grid-template-columns: 11em minmax(0, 1fr); gap: 6px 14px; }
@media (max-width: 600px) { .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; } .kv dd { margin-bottom: 8px; } }
.kv dt { font-weight: 700; font-size: .88rem; color: var(--ink-soft); }
.kv dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.missing { color: var(--ink-soft); font-style: italic; }
.pdf-note { margin: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: .9rem; }
.export textarea { min-height: 220px; font-family: var(--f-mono); font-size: .8rem; }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: .9rem; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 200; max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:6px">
    <span class="eyebrow">Group work · Planning a competence-based learning project</span>
    <h1>Scaffold</h1>
    <p style="font-family:var(--f-display);font-weight:600;font-size:1.15rem">Design competence-oriented learning experiences</p>
    <p class="hint">Work through the five steps with your group. Your answers stay on this device until you copy them.</p>
  </header>
  <ol class="steps" id="steps"></ol>
  <main class="panel" id="panel"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const TOPICS = [
  'Ecological startup: creating a business idea to protect the environment',
  '“Europe without borders”: a virtual journey through the EU countries',
  'Creative economy: creating your own brand',
  '“Letter to the Future”: forecasting technological changes',
  'VR project: a virtual museum of inventions',
  '“Plastic Footprint”: investigating the environmental impact',
  '“Untangling the Knot”: debate on the ethical dilemmas of artificial intelligence',
  'Social advertising “Voice of Youth”',
  'News research: fact or manipulation?',
  '“City of the Future”: designing a sustainable urban model',
];
const CONTEXT = [
  ['space', 'Space', 'Where will learning happen? Classroom, online, outdoors, a lab…'],
  ['objective', 'Objective', 'What should learners achieve?'],
  ['duration', 'Duration', 'How long will the project run?'],
  ['target', 'Target', 'Who are the learners? Age, grade, group size'],
  ['resources', 'Resources', 'What do you already have available?'],
  ['needs', 'Needs', 'What do the learners need?'],
  ['links', 'Real life links', 'How does the project connect to life outside school?'],
];
const FW = {
  ent: { name: 'EntreComp', sub: 'Entrepreneurial competences', areas: [
    ['Ideas and opportunities', ['Spotting opportunities','Creativity','Vision','Valuing ideas','Ethical and sustainable thinking']],
    ['Resources', ['Self-awareness and self-efficacy','Motivation and perseverance','Mobilising resources','Financial and economic literacy','Mobilising others']],
    ['Into action', ['Taking the initiative','Planning and management','Coping with uncertainty, ambiguity and risk','Working with others','Learning through experience']]]},
  dig: { name: 'DigComp', sub: 'Digital competences', areas: [
    ['Information and data literacy', ['Search for information and digital content','Evaluation of digital content','Managing digital content']],
    ['Communication and collaboration', ['Interacting through digital technologies','Sharing through digital technologies','Engaging citizenship through digital technologies','Collaborating through digital technologies','Netiquette','Managing digital identity']],
    ['Digital content creation', ['Developing digital content','Integrating and re-elaborating digital content','Copyright and licences','Programming']],
    ['Safety', ['Protecting devices','Protecting personal data and privacy','Protecting health and well-being','Protecting the environment']],
    ['Problem solving', ['Solving technical problems','Identifying needs and technological responses','Creatively using digital technology','Identifying digital competence gaps']]]},
  grn: { name: 'GreenComp', sub: 'Sustainability competences', areas: [
    ['Embodying sustainability values', ['Valuing sustainability','Supporting fairness','Promoting nature']],
    ['Embracing complexity', ['Systems thinking','Critical thinking','Problem framing']],
    ['Envisioning sustainable futures', ['Futures literacy','Adaptability','Exploratory thinking']],
    ['Acting for sustainability', ['Political agency','Collective action','Individual initiative']]]},
  lif: { name: 'LifeComp', sub: 'Personal, social & learning-to-learn', areas: [
    ['Personal', ['Self-regulation','Flexibility','Wellbeing']],
    ['Social', ['Empathy','Communication','Collaboration']],
    ['Learning to learn', ['Growth mindset','Critical thinking','Managing learning']]]},
  trn: { name: 'Transversal competences', sub: 'Cross-cutting skills', areas: [
    ['Transversal competences', ['Critical thinking','Analytical skills','Problem solving','Creativity','Team work','Intercultural skills','Communication and negotiation skills']]]},
};
const FW_ORDER = ['ent','dig','grn','lif','trn'];
const ASSESS = [
  ['Peer feedback', 'Learners give and receive feedback to and from their peers on where they are in their learning journey and what steps could be taken next.'],
  ['Self-reflection', 'Learners reflect on feedback and evidence to assess themselves against set assessment criteria.'],
  ['Generating assessment evidence', 'Learners use a variety of media to claim, and give evidence for, their competence, presenting to and persuading diverse audiences.'],
  ['Questions for learning', 'Questioning builds rapport and trust, prompting learners to exchange ideas, explore and refine thinking and confirm competence development.'],
  ['Observation', 'Observe learners in action using a variety of observation methods to monitor progress, interest, competence, strengths and needs.'],
  ['Automated assessment', 'Learners access and complete digital assessments which incorporate feedback, reporting and/or portfolio functions.'],
  ['Authentic assessment', 'Learners apply what they have learned in a purposeful, meaningful situation that mirrors real-world expectations, with real stakeholders.'],
];
const TEACH = [
  ['Value creation pedagogy', 'Learners apply their competences to create something of value for at least one stakeholder outside their own group, class or school.'],
  ['Learner-led learning', 'Learners actively contribute their experience to make learning relevant, purposeful and meaningful to their own needs and interests.'],
  ['Project-based learning', 'Learners develop knowledge and skills through projects based on real-world challenges and problems that matter to them.'],
  ['Service learning', 'Learners turn ideas into action to meet real-world needs in their local community.'],
  ['Laboratory learning', 'Learners learn through hands-on experience gained from trial-and-error experimentation with objects, materials and phenomena.'],
  ['Seriously playful learning', 'Learners take a creative, explorative and immersive attitude to learning that stimulates intrinsic motivation and flow.'],
  ['Cooperative learning', 'Learners learn with and from each other, considering diverse perspectives, needs and learning preferences.'],
];
const STEPS = [
  { t: 'Topic & context', slide: 'Slides 1–2' },
  { t: 'Competences', slide: 'Slide 3' },
  { t: 'Starting level', slide: 'Slide 4' },
  { t: 'Teaching method', slide: 'Slide 5' },
  { t: 'Evidence & plan', slide: 'Slide 6' },
  { t: 'Review', slide: '' },
];

const KEY = 'lpp-v1';
const blank = () => ({
  step: 0, group: '', topic: null, ownTopic: '', ctx: {}, comps: [], compNotes: {}, notes: {}, startAssess: [], startExtra: '',
  teach: [], teachExtra: '', output: '', finalAssess: [], finalExtra: '', gather: '', timeline: '',
});
let S = blank();
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === 'object') S = Object.assign(blank(), s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800); }

function stepDone(i) {
  if (i === 0) return (S.topic !== null || S.ownTopic.trim()) && Object.values(S.ctx).some(v => v && v.trim());
  if (i === 1) return S.comps.length > 0;
  if (i === 2) return S.startAssess.length > 0 || S.startExtra.trim();
  if (i === 3) return S.teach.length > 0 || S.teachExtra.trim();
  if (i === 4) return S.output.trim() || S.finalAssess.length || S.gather.trim() || S.timeline.trim();
  return false;
}
function renderSteps() {
  $('steps').innerHTML = '';
  STEPS.forEach((s, i) => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.className = (i === S.step ? 'current ' : '') + (stepDone(i) ? 'done' : '');
    b.innerHTML = `<span class="n">${i < 5 ? 'Step ' + (i + 1) : '✓'}</span><span class="t">${s.t}</span>`;
    b.setAttribute('aria-label', (i < 5 ? 'Step ' + (i + 1) + ': ' : '') + s.t);
    if (i === S.step) b.setAttribute('aria-current', 'step');
    b.onclick = () => go(i);
    li.appendChild(b); $('steps').appendChild(li);
  });
}
function go(i) { S.step = i; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function head(i, title, prompt) {
  return `<div class="panel-head"><span class="eyebrow">Step ${i + 1} of 5 · ${STEPS[i].slide}</span><h2>${title}</h2>${prompt ? `<p class="prompt">${prompt}</p>` : ''}</div>`;
}
function nav(i) {
  const back = i > 0 ? `<button class="btn" id="backBtn">← Back</button>` : '<span></span>';
  const next = i < 4 ? `<button class="btn primary" id="nextBtn">Next: ${STEPS[i + 1].t} →</button>` : i === 4 ? `<button class="btn primary" id="nextBtn">Review your plan →</button>` : '';
  return `<div class="nav">${back}<div class="right">${next}</div></div>`;
}
function bindNav(i) {
  const b = $('backBtn'), n = $('nextBtn');
  if (b) b.onclick = () => go(i - 1);
  if (n) n.onclick = () => go(i + 1);
}
function bindText(id, setter) { const el = $(id); el.addEventListener('input', () => { setter(el.value); save(); renderSteps(); }); }

// Step 1
function step1() {
  const topics = TOPICS.map((t, i) => `<button class="topic" data-i="${i}" aria-pressed="${S.topic === i}"><span class="k">${String(i + 1).padStart(2, '0')}</span><span>${esc(t)}</span></button>`).join('');
  const fields = CONTEXT.map(([k, l, sub]) => `<div class="field"><label for="ctx-${k}">${l}</label><span class="sub">${sub}</span><textarea id="ctx-${k}" rows="2">${esc(S.ctx[k] || '')}</textarea></div>`).join('');
  $('panel').innerHTML = head(0, 'Choose a topic and describe the context', 'Pick one of the topics, or write your own. Then fill in the planning details for your project.') + `
    <div class="block"><div class="field"><label for="group">Group name</label><input type="text" id="group" placeholder="e.g. Group 2" value="${esc(S.group)}"></div></div>
    <div class="block"><h3>Topic</h3><div class="topics" id="topics">${topics}</div>
      <div class="field"><label for="ownTopic">Or your own topic</label><input type="text" id="ownTopic" placeholder="Write a topic of your own" value="${esc(S.ownTopic)}"></div></div>
    <div class="block"><h3>Context</h3><div class="fields">${fields}</div></div>` + nav(0);
  $('topics').onclick = e => {
    const b = e.target.closest('.topic'); if (!b) return;
    const i = +b.dataset.i; S.topic = S.topic === i ? null : i; save();
    $('topics').querySelectorAll('.topic').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.i === S.topic)));
    renderSteps();
  };
  bindText('group', v => S.group = v);
  bindText('ownTopic', v => S.ownTopic = v);
  CONTEXT.forEach(([k]) => bindText('ctx-' + k, v => S.ctx[k] = v));
  bindNav(0);
}

// Step 2
const compKey = (fw, name) => fw + '|' + name;
function selectedComps() {
  if (!S.comps.length) return '<span class="empty">No competences chosen yet. Open a framework below and click a competence to add it.</span>';
  return S.comps.map((k, i) => { const [fw, n] = k.split('|'); return `<div class="note-row fw-${fw}">
    <div class="note-top"><span class="chip" aria-pressed="true">${esc(n)}</span><span class="fw-tag">${FW[fw].name}</span><button class="x-chip" data-k="${esc(k)}" aria-label="Remove ${esc(n)}">×</button></div>
    <textarea id="cn-${i}" data-k="${esc(k)}" rows="2" placeholder="Why this competence? How will learners develop it in this project?">${esc(S.compNotes[k] || '')}</textarea></div>`; }).join('');
}
function step2() {

let downloadsP = null;
function getDownloads() {
  if (!downloadsP) downloadsP = (window.claude && typeof window.claude.use === 'function')

const pdfName = () => ('Scaffold plan' + (S.group.trim() ? ' - ' + S.group.trim() : '')).replace(/[\\/:*?"<>|]+/g, ' ').trim() + '.pdf';
const PDF_FW = { ent: [163, 40, 127], dig: [224, 129, 31], grn: [61, 127, 44], lif: [108, 154, 16], trn: [28, 133, 132] };
function buildPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  doc.addFileToVFS('Carlito-Regular.ttf', FONT_R); doc.addFont('Carlito-Regular.ttf', 'Carlito', 'normal');
  doc.addFileToVFS('Carlito-Bold.ttf', FONT_B); doc.addFont('Carlito-Bold.ttf', 'Carlito', 'bold');
  const W = 210, H = 297, M = 18, CW = W - 2 * M, LBL = 44;
  const ACC = [15, 111, 143], INK = [23, 36, 46], SOFT = [95, 112, 125], LINE = [207, 219, 227];
  let y = M;
  const font = (style, size, color) => { doc.setFont('Carlito', style); doc.setFontSize(size); doc.setTextColor(...color); };
  const lh = size => size * 0.3528 * 1.3;
  const ensure = h => { if (y + h > H - M - 6) { doc.addPage(); y = M; } };
  const para = (text, x, w, style, size, color) => {
    font(style, size, color); const h = lh(size);
    doc.splitTextToSize(String(text), w).forEach(l => { ensure(h); doc.text(l, x, y + h * 0.78); y += h; });
  };
  const empty = (x, w) => para('Not filled in', x, w, 'normal', 10.5, SOFT);
  const section = t => {
    ensure(22); y += 5;
    font('bold', 13.5, ACC); doc.text(t, M, y + 4.6); y += 7.5;
    doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M, y, W - M, y); y += 3.5;
  };
  const label = t => { ensure(lh(10.5)); const y0 = y; para(t, M, LBL - 4, 'bold', 10, SOFT); return y0; };
  const field = (l, v) => {
    const y0 = label(l), yAfterLabel = y; y = y0;
    if (v && String(v).trim()) para(String(v).trim(), M + LBL, CW - LBL, 'normal', 10.5, INK); else empty(M + LBL, CW - LBL);
    y = Math.max(y, yAfterLabel) + 2;
  };
  const item = (name, note, color, missingText) => {
    const x = M + LBL, w = CW - LBL - 5;
    ensure(lh(11) + 1);
    doc.setFillColor(...(color || ACC)); doc.circle(x + 1.3, y + 2.6, 1.1, 'F');
    para(name, x + 5, w, 'bold', 11, INK);
    if (note) para(note, x + 5, w, 'normal', 10.5, INK); else if (missingText) para(missingText, x + 5, w, 'normal', 10, SOFT);
    y += 2;
  };
  const methods = (l, arrKey, extra, missingText) => {
    const y0 = label(l), yAfterLabel = y; y = y0;
    const arr = S[arrKey];
    if (!arr.length && !extra.trim()) empty(M + LBL, CW - LBL);
    arr.forEach(n => item(n, methodNote(arrKey, n), null, missingText));
    if (extra.trim()) item('Extra', extra.trim(), SOFT);
    y = Math.max(y, yAfterLabel) + 1;
  };

  // Header
  font('bold', 9, ACC); doc.text('SCAFFOLD', M, y + 3, { charSpace: 0.35 });
  font('normal', 9, SOFT); doc.text(new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }), W - M, y + 3, { align: 'right' });
  y += 6;
  para('Design competence-oriented learning experiences', M, CW, 'normal', 12, SOFT);
  y += 3;
  if (S.group.trim()) para(S.group.trim(), M, CW, 'bold', 11, INK);
  para(topicText() || 'Learning project plan', M, CW, 'bold', 19, INK);
  y += 1;

  section('1 · Topic & context');
  field('Topic', topicText());
  CONTEXT.forEach(([k, l]) => field(l, S.ctx[k]));

  section('2 · Competences');
  const fws = FW_ORDER.filter(k => S.comps.some(c => c.startsWith(k + '|')));
  if (!fws.length) { const y0 = y; empty(M, CW); y = Math.max(y, y0) + 2; }
  fws.forEach(k => {
    const y0 = label(FW[k].name), yAfterLabel = y; y = y0;
    S.comps.filter(c => c.startsWith(k + '|')).map(c => c.split('|')[1]).forEach(n => item(n, compNote(k, n), PDF_FW[k], 'No reasoning written'));
    y = Math.max(y, yAfterLabel) + 1;
  });

  section('3 · Starting level');
  methods('Assessment method', 'startAssess', S.startExtra, 'Application not described');
  section('4 · Teaching method');
  methods('Method', 'teach', S.teachExtra, 'Application not described');
  section('5 · Evidence & plan');
  field('Output / Evidence', S.output);
  methods('Assessment method', 'finalAssess', S.finalExtra, 'Application not described');
  field('Resources', S.gather);
  field('Timeline', S.timeline);

  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); font('normal', 8.5, SOFT);
    doc.text('Scaffold · Design competence-oriented learning experiences' + (S.group.trim() ? ' · ' + S.group.trim() : ''), M, H - 10);
    doc.text(i + ' / ' + n, W - M, H - 10, { align: 'right' });
  }
  return doc.output('blob');
}

// keep only competences that exist in the lists (drops entries typed in an earlier version)
const VALID = new Set(FW_ORDER.flatMap(k => FW[k].areas.flatMap(([, l]) => l.map(c => compKey(k, c)))));
S.comps = S.comps.filter(c => VALID.has(c));
function render() {
  renderSteps();
  [step1, step2, step3, step4, step5, review][S.step]();
}
render();
</script>
